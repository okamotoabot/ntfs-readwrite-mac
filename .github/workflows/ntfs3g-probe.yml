name: ntfs3g-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-latest
    steps:
      - name: System info
        run: |
          sw_vers
          uname -m

      - name: Install fuse-t, pkg-config and build tools
        run: |
          brew install --cask fuse-t
          unset HOMEBREW_FORBID_PACKAGES_FROM_SOURCE
          brew install pkgconf autoconf automake libtool || true
          brew install autoconf automake libtool

      - name: Create fuse.pc shim for fuse-t
        run: |
          sudo tee /usr/local/lib/pkgconfig/fuse.pc > /dev/null <<'EOF'
          prefix=/usr/local
          libdir=${prefix}/lib
          includedir=${prefix}/include

          Name: fuse
          Description: FUSE 2.x compat shim pointing at FUSE-T
          Version: 2.9.9
          Libs: -L${libdir} -lfuse-t
          Cflags: -I${includedir}/fuse
          EOF
          cat /usr/local/lib/pkgconfig/fuse.pc
          PKG_CONFIG_PATH=/usr/local/lib/pkgconfig pkg-config --modversion fuse
          PKG_CONFIG_PATH=/usr/local/lib/pkgconfig pkg-config --libs --cflags fuse

      - name: Build ntfs-3g from source against fuse-t
        run: |
          set -x
          curl -fL --retry 3 -o /tmp/n3.tgz https://github.com/tuxera/ntfs-3g/archive/refs/tags/2026.7.7.tar.gz || \
            curl -fL --retry 3 -o /tmp/n3.tgz https://github.com/tuxera/ntfs-3g/archive/refs/tags/2022.10.3.tar.gz
          cd /tmp && tar xzf n3.tgz && cd ntfs-3g-*
          ./autogen.sh
          PKG_CONFIG_PATH=/usr/local/lib/pkgconfig CFLAGS="-D_FILE_OFFSET_BITS=64" ./configure --prefix=/usr/local --exec-prefix=/usr/local --with-fuse=external
          make -j4
          sudo make install
          /usr/local/bin/ntfs-3g --version

      - name: Create NTFS disk image
        run: |
          dd if=/dev/zero of=/tmp/ntfs.img bs=1048576 count=64
          /usr/local/bin/mkntfs -F -L NTFSTEST /tmp/ntfs.img

      - name: Attach image and mount with ntfs-3g
        run: |
          set -x
          OUT=$(hdiutil attach -imagekey diskimage-class=CRawDiskImages -nomount /tmp/ntfs.img)
          echo "$OUT"
          DISK=$(echo "$OUT" | head -1 | awk '{print $1}')
          if [ -e "${DISK}s1" ]; then DEV="${DISK}s1"; else DEV="$DISK"; fi
          echo "DEV=$DEV" >> "$GITHUB_ENV"
          echo "DISK=$DISK" >> "$GITHUB_ENV"
          sudo mkdir -p /Volumes/ntfstest
          sudo /usr/local/bin/ntfs-3g "$DEV" /Volumes/ntfstest -o volname=NTFSTEST,allow_other || \
            sudo /usr/local/bin/ntfs-3g "$DEV" /Volumes/ntfstest -o volname=NTFSTEST
          sleep 2
          mount | grep -i ntfs || true

      - name: Read-write-delete test
        run: |
          sudo bash -c 'echo "ntfs-3g works on $(sw_vers -productVersion)" > /Volumes/ntfstest/hello.txt'
          sudo cat /Volumes/ntfstest/hello.txt
          sudo bash -c 'mkdir /Volumes/ntfstest/dir1 && echo abc > /Volumes/ntfstest/dir1/f2.txt && cat /Volumes/ntfstest/dir1/f2.txt && rm /Volumes/ntfstest/dir1/f2.txt && rmdir /Volumes/ntfstest/dir1 && ls -la /Volumes/ntfstest'

      - name: Unmount and detach
        if: always()
        run: |
          sudo umount /Volumes/ntfstest || true
          if [ -n "${{ env.DISK }}" ]; then hdiutil detach "${{ env.DISK }}" || true; fi
