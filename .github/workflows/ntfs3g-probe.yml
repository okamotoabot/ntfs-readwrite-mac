name: ntfs3g-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-latest
    steps:
      - name: System info
        run: |
          sw_vers
          uname -m

      - name: Discover formulas
        run: |
          brew search ntfs || true
          brew search fuse-t || true

      - name: Install fuse-t and ntfs-3g
        run: |
          brew install --cask fuse-t
          brew install ntfs-3g

      - name: Check installed binaries
        run: |
          ls -l /opt/homebrew/bin/ntfs-3g /opt/homebrew/bin/mkntfs || true
          ls /Library/Filesystems 2>/dev/null | grep -i fuse || true
          /opt/homebrew/bin/ntfs-3g --version || true

      - name: Create NTFS disk image
        run: |
          dd if=/dev/zero of=/tmp/ntfs.img bs=1048576 count=64
          /opt/homebrew/bin/mkntfs -F -L NTFSTEST /tmp/ntfs.img

      - name: Attach image and mount with ntfs-3g
        run: |
          set -x
          OUT=$(hdiutil attach -imagekey diskimage-class=CRawDiskImages -nomount /tmp/ntfs.img)
          echo "$OUT"
          DISK=$(echo "$OUT" | head -1 | awk '{print $1}')
          echo "DISK=$DISK"
          if [ -e "${DISK}s1" ]; then DEV="${DISK}s1"; else DEV="$DISK"; fi
          echo "DEV=$DEV"
          sudo mkdir -p /Volumes/ntfstest
          sudo /opt/homebrew/bin/ntfs-3g "$DEV" /Volumes/ntfstest -o volname=NTFSTEST
          sleep 2
          mount | grep -i ntfs || true

      - name: Read-write-delete test
        run: |
          sudo bash -c 'echo "ntfs-3g works on $(sw_vers -productVersion)" > /Volumes/ntfstest/hello.txt'
          sudo cat /Volumes/ntfstest/hello.txt
          sudo bash -c 'mkdir /Volumes/ntfstest/dir1 && echo abc > /Volumes/ntfstest/dir1/f2.txt && cat /Volumes/ntfstest/dir1/f2.txt && rm /Volumes/ntfstest/hello.txt && ls -la /Volumes/ntfstest'

      - name: Unmount and eject
        if: always()
        run: |
          sudo umount /Volumes/ntfstest || sudo diskutil eject /dev/$(diskutil list | grep -B0 NTFSTEST | head -1) || true
          hdiutil detach $(hdiutil info | grep /tmp/ntfs.img | awk '{print $1}') || true
